[project]
name = "routeplanner"
version = "0.1.0"
description = "Generate varied walking routes from a start point."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The OSM graph random-walk engine (--engine osm). Heavy geo stack, so it's
# opt-in: `uv sync --extra osm`. The default ORS-only install stays lean.
osm = [
    "osmnx>=2.0",
    "networkx>=3.0",
    "scikit-learn>=1.3",  # osmnx nearest_nodes on an unprojected (lat/lon) graph
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routeplanner"]
